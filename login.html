<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

  <div class="d-flex vh-100 align-items-center justify-content-center">
    <div class="login-box text-center">

      <h4 class="mb-4">Iniciar sesión</h4>

      <form method="post" action="login.php">
        <div class="mb-3">
          <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Correo electrónico" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-check text-start mb-3">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Recordar contraseña</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
      </form>

      <p class="link mb-2"><a href="recuperar.php">¿Olvidaste tu contraseña?</a></p>
      <p class="link">¿No tenés cuenta? <a href="./registro.php">Registrate</a></p>

    </div>
  </div>

</body>
</html>
