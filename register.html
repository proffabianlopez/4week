<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link type="text/css" href="./css/index.css" rel="stylesheet" />
    <title>Formulario de Registro</title>
  </head>
  <body style="background-color: #f8f9fa">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm rounded-4">
            <div class="card-body p-4">
              <h2 class="card-title text-center mb-4">Registro</h2>

              <form class="mb-4" action="./mail.php" method="POST">
                <div class="mb-3">
                  <label for="name" class="form-label">Nombre completo</label>
                  <input
                    type="text"
                    id="name"
                    name="visitor_name"
                    class="form-control"
                    placeholder="Juan Pérez"
                    pattern="[A-Z\sa-z]{3,20}"
                    autocomplete="off"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label"
                    >Correo electrónico</label
                  >
                  <input
                    type="email"
                    id="email"
                    name="visitor_email"
                    class="form-control"
                    placeholder="mimail@email.com"
                    autocomplete="off"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    id="password"
                    name="visitor_password"
                    class="form-control"
                    placeholder="••••••••"
                    autocomplete="off"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                  Registrarse
                </button>
              </form>
              <p class="text-center link">
                ¿Ya tenés una cuenta? <a href="./login.php">Iniciar sesión</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
